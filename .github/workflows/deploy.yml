name: Churn API CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Check Python syntax
        run: |
          python -m compileall src api

  build-and-push-ecr-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install model dependencies
        run: |
          pip install \
            mlflow \
            xgboost \
            scikit-learn \
            pandas \
            numpy \
            skops

      - name: Download model from DagsHub
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.DAGSHUB_MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MODEL_ID: ${{ secrets.MODEL_ID }}
        run: |
          mkdir -p models/churn_model

          python - <<'PY'
          import os
          import shutil
          import mlflow
          import mlflow.sklearn

          mlflow.set_tracking_uri(
              os.environ["MLFLOW_TRACKING_URI"]
          )

          model_id = os.environ["MODEL_ID"]
          model_uri = f"models:/{model_id}"

          print(f"Downloading model from: {model_uri}")

          local_path = mlflow.artifacts.download_artifacts(
              artifact_uri=model_uri
          )

          print(f"Model downloaded to: {local_path}")

          shutil.copytree(
              local_path,
              "models/churn_model",
              dirs_exist_ok=True,
          )
          PY

      - name: Check downloaded model
        run: |
          echo "Downloaded model files:"
          find models -maxdepth 3 -type f -print

      - name: Verify model can be loaded
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.DAGSHUB_MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MODEL_ID: ${{ secrets.MODEL_ID }}
        run: |
          python - <<'PY'
          import os
          import mlflow
          import mlflow.sklearn

          mlflow.set_tracking_uri(
              os.environ["MLFLOW_TRACKING_URI"]
          )

          model_id = os.environ["MODEL_ID"]

          model = mlflow.sklearn.load_model(
              f"models:/{model_id}"
          )

          print("Model loaded successfully.")
          print(f"Model type: {type(model)}")
          PY

      - name: Create model metadata
        run: |
          mkdir -p models
          echo '{"threshold": 0.77}' > models/metadata.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker build \
            -t $IMAGE_URI \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

          docker push $IMAGE_URI
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest